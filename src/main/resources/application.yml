# ==========================================================
# SERVER CONFIGURATION
# ==========================================================
server:
  port: 8082
  forward-headers-strategy: framework

  servlet:
    context-path: /booking
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  tomcat:
    connection-timeout: 30000
    max-connections: 200
    threads:
      max: 50
      min-spare: 5


# ==========================================================
# SPRING BOOT CORE CONFIGURATION
# ==========================================================
spring:

  # ----------------------------------------------------------
  # APPLICATION INFO
  # ----------------------------------------------------------
  application:
    name: moment-forever-booking


  # ----------------------------------------------------------
  # SERVICE DISCOVERY - CONSUL
  # ----------------------------------------------------------
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: 8500
      discovery:
        enabled: true
        register: true
        service-name: ${spring.application.name}
        health-check-path: /booking/actuator/health
        health-check-interval: 10s
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: true
        deregister-after: 1m


  # ----------------------------------------------------------
  # DATABASE - POSTGRESQL
  # ----------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5433/moment_forever_book?options=-c%20timezone%3DUTC
    username: postgres
    password: groote
    driver-class-name: org.postgresql.Driver

  # ----------------------------------------------------------
  # HIKARI CONNECTION POOL
  # ----------------------------------------------------------
  hikari:
    pool-name: MomentForeverBooking-HikariPool
    connection-timeout: 30000
    maximum-pool-size: 20
    minimum-idle: 5
    idle-timeout: 600000
    max-lifetime: 1800000
    connection-test-query: SELECT 1
    auto-commit: false


  # ----------------------------------------------------------
  # JPA / HIBERNATE
  # ----------------------------------------------------------
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
        query:
          in_clause_parameter_padding: true
        id:
          new_generator_mappings: true


  # ----------------------------------------------------------
  # KAFKA CONFIGURATION
  # ----------------------------------------------------------
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

    consumer:
      group-id: booking-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"


  # ----------------------------------------------------------
  # MONGODB
  # ----------------------------------------------------------
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:27017
      database: moment_forver_book


  # ----------------------------------------------------------
  # FILE UPLOAD
  # ----------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB


  # ----------------------------------------------------------
  # JACKSON CONFIG
  # ----------------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
    default-property-inclusion: non_null


# ==========================================================
# LOGGING
# ==========================================================
logging:
  level:
    com.forvmom.MomentForeverBooking: DEBUG


# ==========================================================
# CUSTOM APPLICATION CONFIG
# ==========================================================
app:
  base-url: http://localhost:8081
  file:
    upload-dir: ./uploads/
    max-size: 5242880
    allowed-extensions: jpg,jpeg,png,gif,webp
    serve-path: /uploads/**

slug:
  separator: "-"
  max-length: 100

rate-limit:
  login:
    max-attempts: 5
    window-minutes: 15
  registration:
    max-per-hour: 10
    max-per-ip: 50


# ==========================================================
# ACTUATOR
# ==========================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  probes:
    enabled: true


# ==========================================================
# SWAGGER / OPENAPI
# ==========================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs
    persist-authorization: true
  api-docs:
    path: /v3/api-docs


# ==========================================================
# OBJECT STORAGE
# ==========================================================
object:
  store:
    provider: gridfs
    gridfs-bucket: fs


# ==========================================================
# CUSTOM KAFKA TOPICS
# ==========================================================
kafka:
  topics:
    booking-requested: topic_booking_requested
    booking-confirmed: topic_booking_confirmed
    booking-failed: topic_booking_failed
    payment-requested: topic_payment_requested
    payment-confirmed: topic_payment_confirmed
    payment-failed: topic_payment_failed